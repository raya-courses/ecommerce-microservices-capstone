name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      push_images:
        description: 'Push Docker images to container registry'
        required: false
        type: boolean
        default: false
      deploy_k8s:
        description: 'Deploy to Kubernetes cluster (manual trigger only)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Build & Test Java Modules with JaCoCo
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run unit, integration tests, and JaCoCo coverage
        run: mvn clean verify --batch-mode

      - name: Package artifacts
        run: mvn package -DskipTests --batch-mode

  validate-k8s-and-helm:
    name: Validate Kubernetes Manifests, Docker Compose & Helm Charts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'latest'

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: 'latest'

      - name: Validate Docker Compose configuration
        run: docker compose config --quiet

      - name: Validate Kustomize and Kubernetes manifests
        run: |
          echo "Rendering Kustomize manifests offline..."
          kubectl kustomize k8s/ > /tmp/rendered.yaml
          echo "Verifying rendered manifests exist and are non-empty..."
          test -s /tmp/rendered.yaml

      - name: Lint Helm Charts
        run: |
          echo "Linting product-service-chart..."
          helm lint helm/product-service-chart
          echo "Linting order-service-chart..."
          helm lint helm/order-service-chart

  docker-build:
    name: Build & Push Docker Images
    needs: [test-and-build, validate-k8s-and-helm]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: eureka-server
            context: infrastructure/eureka-server
          - service: config-server
            context: infrastructure/config-server
          - service: api-gateway
            context: infrastructure/api-gateway
          - service: product-service
            context: services/product-service
          - service: order-service
            context: services/order-service
          - service: payment-service
            context: services/payment-service
          - service: inventory-service
            context: services/inventory-service
          - service: notification-service
            context: services/notification-service
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Determine repository owner in lowercase
        id: repo_meta
        run: |
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "owner_lc=${OWNER_LOWER}" >> $GITHUB_OUTPUT

      - name: Determine whether to push images
        id: check_push
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.push_images }}" = "true" ]; then
            echo "push=true" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "push=true" >> $GITHUB_OUTPUT
          else
            echo "push=false" >> $GITHUB_OUTPUT
          fi

      - name: Log in to GitHub Container Registry (GHCR)
        if: steps.check_push.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and optionally push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/Dockerfile
          push: ${{ steps.check_push.outputs.push == 'true' }}
          tags: |
            ghcr.io/${{ steps.repo_meta.outputs.owner_lc }}/${{ matrix.service }}:${{ github.sha }}
            ghcr.io/${{ steps.repo_meta.outputs.owner_lc }}/${{ matrix.service }}:latest

  deploy-kubernetes:
    name: Deploy to Kubernetes
    needs: [docker-build]
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_k8s == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'latest'

      - name: Configure Kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBECONFIG }}" > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Apply Kubernetes manifests
        run: |
          kubectl apply -k k8s/
          kubectl rollout status deployment/api-gateway -n microservices-pro --timeout=180s
