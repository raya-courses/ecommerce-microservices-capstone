apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-order-service
  namespace: {{ .Values.namespace }}
  labels:
    app: order-service
    release: {{ .Release.Name }}
spec:
  type: {{ .Values.service.type }}
  selector:
    app: order-service
    release: {{ .Release.Name }}
  ports:
    - protocol: TCP
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.port }}
