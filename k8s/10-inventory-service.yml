apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-service
  namespace: microservices-pro
  labels:
    app: inventory-service
    app.kubernetes.io/part-of: microservices-pro-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app: inventory-service
  template:
    metadata:
      labels:
        app: inventory-service
    spec:
      serviceAccountName: inventory-service-sa
      containers:
        - name: inventory-service
          image: microservices-pro/inventory-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8084
              name: http
          envFrom:
            - configMapRef:
                name: platform-config
          resources:
            requests:
              cpu: 200m
              memory: 384Mi
            limits:
              cpu: 1000m
              memory: 768Mi
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8084
            initialDelaySeconds: 25
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8084
            initialDelaySeconds: 35
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: inventory-service
  namespace: microservices-pro
  labels:
    app: inventory-service
    app.kubernetes.io/part-of: microservices-pro-platform
spec:
  ports:
    - port: 8084
      targetPort: 8084
      name: http
  selector:
    app: inventory-service
