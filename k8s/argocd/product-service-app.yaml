apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: product-service
  namespace: argocd
  # ArgoCD itself runs in the "argocd" namespace.
  # It manages resources in the "microservices-pro" namespace (see spec.destination below).
spec:
  project: default
  source:
    repoURL: https://github.com/SayedBaladoh/microservices-pro-platform.git
    targetRevision: main
    path: k8s/product-service
    # ArgoCD watches this directory. Any change to a YAML file here
    # triggers a sync — this is the Pull model of GitOps.
  destination:
    server: https://kubernetes.default.svc
    namespace: microservices-pro
  syncPolicy:
    automated:
      prune: true      # delete resources removed from Git
      selfHeal: true   # revert manual kubectl changes (GitOps enforcement)
    syncOptions:
      - CreateNamespace=true   # creates "microservices-pro" namespace if it doesn't exist
