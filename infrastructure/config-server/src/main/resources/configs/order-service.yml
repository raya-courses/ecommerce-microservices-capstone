# order-service.yml
# Served by Config Server to Order Service at startup.

app:
  source: "config-server"

spring:
  kafka:
    listener:
      observation-enabled: true
    template:
      observation-enabled: true
  cloud:
    openfeign:
      micrometer:
        enabled: true

feign:
  micrometer:
    enabled: true

management:
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: ${MANAGEMENT_ZIPKIN_TRACING_ENDPOINT:http://localhost:9411/api/v2/spans}
